# Sales territories — who is responsible for advisors in each state.
#
# THIS IS A BUSINESS FACT, MAINTAINED BY HAND. It is not derived at build time
# and must not be. Territories change when someone joins, leaves, or the map is
# redrawn, and the moment this file disagrees with reality the app will tell a
# rep, with total confidence, that an advisor belongs to the wrong colleague.
# Edit it deliberately and change `as_of` when you do.
#
# WHERE IT CAME FROM
# ------------------
# Recovered on 2026-08-13 from the Act! CRM's "EIC Contact" field, which is
# populated on 37,904 of 47,426 contacts. Every state resolved to exactly one
# owner: 51 of 51 states and DC, all above 90% internal agreement, no state
# ambiguous. Each territory is geographically contiguous, which is the strongest
# evidence that this is a designed map rather than an accident of the data.
#
# It was validated OUT OF SAMPLE. The map was built from non-LPL records only,
# then tested against the 6,141 LPL contacts that had been assigned by hand:
# 6,140 matched — 100.0%. A separate 149 assigned records from the 2025 LPL load
# matched 148 (99.3%).
#
# WHY IT IS AUTHORITATIVE OVER THE CRM FIELD
# ------------------------------------------
# The CRM's owner field is BLANK on 9,223 LPL contacts loaded in 2025 that were
# never assigned. Those blanks are a data gap, not a finding: each salesperson is
# responsible for the LPL advisors in their territory whether or not anyone
# tagged the record. So this map is more accurate than the field it came from,
# and it covers all 127,445 advisors in the map rather than only the 47,426 in
# the CRM.
#
# WHAT IT IS FOR
# --------------
# A TERRITORY NOTICE: "this advisor is in TN and is assigned to Matt Keeter."
# It tells a rep they are looking outside their own patch. It is NOT a statement
# that a relationship exists — that is a different fact, carried by
# has_clients___eic and the b* book of business, and it gets its own signal.

as_of: 2026-08-13
source: Act! CRM "EIC Contact" field, recovered 2026-08-13

# Email is the join key in BOTH directions. The web app knows the signed-in
# person's address from Entra (/.auth/me), and Act! user names are email
# addresses, so state -> initials -> email -> Act! user id resolves with no
# hand-maintained id table. Act! user GUIDs are deliberately NOT recorded here:
# they are specific to one Act! database and are looked up at runtime from
# GET /api/users, so this file stays portable and cannot go stale against them.
#
# All seven territory owners were confirmed ACTIVE Act! users on 2026-08-13.
