  SZ:  {name: Steve Zimmerman,   email: szimmerman@eicatlanta.com}
  TL:  {name: Tate Lambeth,      email: tlambeth@eicatlanta.com}
  SH:  {name: Stephen Halley,    email: shalley@eicatlanta.com}
  DM:  {name: Dennis McKinney,   email: dmckinney@eicatlanta.com}
  KT:  {name: Keith R. Telesca,  email: ktelesca@eicatlanta.com}
  MK:  {name: Matt Keeter,       email: mkeeter@eicatlanta.com}
  SB:  {name: Sam Borland,       email: sborland@eicatlanta.com}
  # National / overlay roles. These are NOT territorial: JPP appears in 36
