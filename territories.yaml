  # them on a specific contact, that value is a relationship fact and should win
  # over the state rule.
  JPP: {name: Paul Power,         email: ppower@eicatlanta.com}
  RTI: {name: R. Terrence Irrgang, email: tirrgang@eicatlanta.com}
  # In the CRM picklist with few or no current records. Andrew Bruner's Act!
