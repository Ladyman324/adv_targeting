# PR and VI belong to SB. That was missed on the first pass here -- the CRM has
# almost no Caribbean records to derive from -- and was caught by audit.py
# comparing this file against the TERRITORIES map app.js has carried by hand
# since long before it, whose comment says plainly that "VI folds into
# Florida/PR (Borland's Caribbean book)".
#
# GU and the foreign addresses in the file have no assigned owner, and the
# notice says nothing rather than guessing.
